<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>Weather App</h1>
    </header>
    <main>
      <form>
        <input
          type="search"
          name="location"
          id="locationSearch"
          placeholder="Enter your location..."
        />
        <button type="submit" id="searchBtn">Search</button>
      </form>
      <div class="weatherData">
        <div class="currentData">
          <h2 id="address">Barnaul</h2>
          <div class="weather">
            <div id="temp">+19&deg;C</div>
            <div id="condition">
              <div class="condition-name">Cloudy</div>
              <img class="condition-img" />
            </div>
            <div id="feelslike">Feels like: +16&deg;C</div>
          </div>
        </div>
        <div class="weekData">
          <h2>7 Day Forecast</h2>
          <div class="weekDay" id="dayOne">
            <img class="condition-img" />
            <div class="weekTemp">+19&deg;C</div>
          </div>
          <div class="weekDay" id="dayTwo">
            <img class="condition-img" />
            <div class="weekTemp">+19&deg;C</div>
          </div>
          <div class="weekDay" id="dayThree">
            <img class="condition-img" />
            <div class="weekTemp">+19&deg;C</div>
          </div>
          <div class="weekDay" id="dayFour">
            <img class="condition-img" />
            <div class="weekTemp">+19&deg;C</div>
          </div>
          <div class="weekDay" id="dayFive">
            <img class="condition-img" />
            <div class="weekTemp">+19&deg;C</div>
          </div>
          <div class="weekDay" id="daySix">
            <img class="condition-img" />
            <div class="weekTemp">+19&deg;C</div>
          </div>
          <div class="weekDay" id="daySeven">
            <img class="condition-img" />
            <div class="weekTemp">+19&deg;C</div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
